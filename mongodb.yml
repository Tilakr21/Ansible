- name: Configure the mongodb server 
  hosts: mongodb
  become: true
  
  tasks:
    - name: Copying the mongo repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: Installing mongo database 
      ansible.builtin.package:
       name: mongodb-org
       state: present

    - name: Editing the configuration file of mongo
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'

    - name: Enabling & starting the service of mongo 
      ansible.builtin.service:
        name: mongodb-org
        enabled: yes
        state: restarted